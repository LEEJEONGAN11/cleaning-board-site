<style>
/* Layout concept: a work tool for two founders. A deep teal shell (the colour of a detergent bottle) holds the tabs; the work sits on white sheets divided by hairlines instead of cards; decisions are struck with a marker in rubber-glove yellow. Meetings, minutes and settings are full screens, never pop-ups. */
:root {
  --font: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;

  --ac1: #0F766E; --ac2: #2F5FD0; --ac3: #B45309; --ac4: #7C3AED; --ac5: #BE185D; --ac6: #4D7C0F; --ac7: #0369A1; --ac8: #9A3412;
  --n-biz: #E3EBFF; --n-money: #DDF3E4; --n-people: #FBE3EC; --n-life: #FFF1CC; --n-health: #D8F1EF; --n-etc: #ECEEF3;
  --shadow: 0 1px 2px rgba(16, 35, 34, 0.06); --shadow-lg: 0 10px 28px rgba(16, 35, 34, 0.16);
  --bar-h: 62px;
}

    --km-bg: #0F3A36; --km-fg: #7FE0D2;

    --kl-bg: #4A1F1B; --kl-fg: #FFA89C;

    --ac1: #5DD4C6; --ac2: #8DB0FF; --ac3: #F2B462; --ac4: #BBA6FF; --ac5: #F29BC1; --ac6: #A8D86A; --ac7: #7CCBF0; --ac8: #F29B7A;
    --n-biz: #1F2D5A; --n-money: #17392B; --n-people: #4A2237; --n-life: #3F3210; --n-health: #123B39; --n-etc: #272F45;

}
:root[data-theme="dark"] {
  --shell: #0A2523; --shell-ink: #E9F6F3; --shell-muted: #8FB5AF;
  --ground: #071413; --paper: #0E2220; --paper-2: #0B1C1A;
  --ink: #E4F1EE; --ink-2: #B9D0CC; --muted: #8DA8A4;
  --rule: #1D3836; --rule-2: #2D504C;
  --teal: #5DD4C6; --sel-bg: #1D4A46; --sel-ink: #E9F6F3;
  --marker: #FFD84A; --on-marker: #1E1700; --mk-bg: rgba(255, 216, 74, 0.17); --mk-ink: #FFE98E; --mk-line: rgba(255, 216, 74, 0.5);
  --stamp: #FF8E80; --danger: #FF8E80; --danger-bg: #4A1F1B;

  --kl-bg: #4A1F1B; --kl-fg: #FFA89C;
  --kt-bg: #1B2E57; --kt-fg: #A9C4FF;
  --ks-bg: #2E2459; --ks-fg: #CDBBFF;
  --ac1: #5DD4C6; --ac2: #8DB0FF; --ac3: #F2B462; --ac4: #BBA6FF; --ac5: #F29BC1; --ac6: #A8D86A; --ac7: #7CCBF0; --ac8: #F29B7A;
  --n-biz: #1F2D5A; --n-money: #17392B; --n-people: #4A2237; --n-life: #3F3210; --n-health: #123B39; --n-etc: #272F45;

* { box-sizing: border-box; }
html { scrollbar-gutter: stable; scrollbar-color: var(--rule-2) transparent; }
body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--font); font-size: 0.9375rem; line-height: 1.65; padding-inline: 0; padding-block: 0; }
::selection { background: var(--marker); color: var(--on-marker); }
h1, h2, h3, h4, p, ul, ol, dl, dd, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
h1 { font-size: 1.0625rem; line-height: 1.3; letter-spacing: -0.01em; }
h2 { font-size: 1.25rem; line-height: 1.3; letter-spacing: -0.015em; text-wrap: balance; }
h3 { font-size: 1rem; line-height: 1.4; letter-spacing: -0.005em; }
h4 { font-size: 0.8125rem; line-height: 1.4; color: var(--muted); font-weight: 700; }
small, .small { font-size: 0.8125rem; }

button, input, select, textarea { font: inherit; color: inherit; }

:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; border-radius: 4px; }
img { max-width: 100%; display: block; }
b, strong { font-weight: 700; }
.mono { width: 100%; min-height: 120px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.8rem; line-height: 1.5; }

/* shell */
.shell { background: var(--shell); color: var(--shell-ink); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
.shell-in { max-width: 1120px; margin-inline: auto; padding: 10px 16px 0; display: flex; flex-direction: column; gap: 2px; }
.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 16px; }
.brand h1 { color: var(--shell-ink); }
.brand .meta { font-size: 0.75rem; color: var(--shell-muted); line-height: 1.4; }
.top .links { display: flex; align-items: center; gap: 12px; font-size: 0.8125rem; flex-wrap: wrap; }
.top .links a { color: var(--shell-ink); }
.shell .savestate { font-size: 0.78rem; color: var(--shell-muted); }
.editctl { display: inline-flex; align-items: center; gap: 10px; }
@media (max-width: 560px) { .top .links { width: 100%; justify-content: space-between; } .editctl { margin-left: auto; } .shell .savestate { max-width: 11rem; line-height: 1.3; } }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { background: none; border: 0; color: var(--shell-muted); padding: 10px 14px 9px; border-bottom: 3px solid transparent; cursor: pointer; font-weight: 500; white-space: nowrap; border-radius: 0; }
.tab:hover { color: var(--shell-ink); }
.tab[aria-selected="true"] { color: var(--shell-ink); font-weight: 700; border-bottom-color: var(--marker); }
.tab.priv { margin-left: auto; }
.tab.priv ~ .tab.priv { margin-left: 0; }
.wrap { max-width: 1120px; margin-inline: auto; padding: 20px 16px 72px; display: flex; flex-direction: column; gap: 20px; }
#panel { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
footer { font-size: 0.8125rem; color: var(--muted); max-width: 70ch; }
body.in-meeting .shell, body.in-meeting footer { display: none; }
body.in-meeting .wrap { max-width: 1560px; padding-top: 0; }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 14px; min-height: 36px; border-radius: 8px; border: 1px solid var(--rule-2); background: var(--paper); color: var(--ink); cursor: pointer; font-weight: 500; line-height: 1.3; transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease; }
.btn:hover:not(:disabled) { background: var(--paper-2); border-color: var(--ink-2); }
.btn.primary { background: var(--marker); border-color: var(--marker); color: var(--on-marker); font-weight: 700; }
.btn.primary:hover:not(:disabled) { background: var(--marker); border-color: var(--on-marker); filter: brightness(0.96); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover:not(:disabled) { color: var(--ink); background: var(--paper-2); border-color: transparent; }
.btn.danger { border-color: var(--danger); color: var(--danger); background: transparent; }
.btn.danger:hover:not(:disabled) { background: var(--danger-bg); border-color: var(--danger); }
.btn.small { min-height: 30px; padding: 3px 10px; font-size: 0.8125rem; }
.btn.icon { padding: 0; width: 36px; }
.btn.icon.small { width: 30px; }
.btn.onshell { background: transparent; color: var(--shell-ink); border-color: rgba(255, 255, 255, 0.3); }
.btn.onshell:hover:not(:disabled) { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.55); }
.btn.linklike { border: 0; background: none; padding: 0; min-height: 0; color: var(--teal); font-weight: 500; font-size: inherit; }
.btn.linklike:hover:not(:disabled) { background: none; text-decoration: underline; }
.btn.ml { margin-left: auto; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: 0.45; cursor: default; }
input[type="search"], input[type="text"], input[type="password"], input[type="time"], input[type="date"], select, textarea { font-size: 0.9375rem; padding: 7px 10px; min-height: 36px; border-radius: 8px; border: 1px solid var(--rule-2); background: var(--paper); color: var(--ink); min-width: 0; }
textarea { line-height: 1.6; resize: vertical; min-height: 72px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--teal); outline-offset: 0; border-color: var(--teal); }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: 0.8; }
input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--teal); flex: none; }
.seg { display: inline-flex; border: 1px solid var(--rule-2); border-radius: 8px; overflow: hidden; align-self: flex-start; background: var(--paper); }
.seg button { background: transparent; border: 0; padding: 6px 16px; cursor: pointer; color: var(--muted); min-height: 34px; white-space: nowrap; font-weight: 500; }
.seg button + button { border-left: 1px solid var(--rule-2); }
.seg button:hover { color: var(--ink); background: var(--paper-2); }
.seg button[aria-pressed="true"] { background: var(--sel-bg); color: var(--sel-ink); font-weight: 700; }
.seg.small button { padding: 3px 11px; font-size: 0.8125rem; min-height: 28px; }
.chip { font-size: 0.8125rem; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--rule-2); background: var(--paper); color: var(--ink); cursor: pointer; }
.chip:hover { background: var(--paper-2); }
.chip[aria-pressed="true"] { background: var(--sel-bg); border-color: var(--sel-bg); color: var(--sel-ink); font-weight: 700; }
.chip .n { font-variant-numeric: tabular-nums; opacity: 0.75; margin-left: 4px; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.acts.split { justify-content: space-between; }
.inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.inline input[type="text"] { flex: 1 1 200px; }
.msg { min-height: 1.4em; color: var(--muted); font-size: 0.875rem; }
.msg.err { color: var(--danger); }
.form { display: flex; flex-direction: column; gap: 12px; }
.form.tight { gap: 10px; }
.form label, .lab { font-size: 0.8125rem; color: var(--muted); display: flex; flex-direction: column; gap: 4px; font-weight: 500; }
label.inl { flex-direction: row; align-items: center; gap: 8px; color: var(--ink); font-size: 0.875rem; font-weight: 400; }
label.inl.small { font-size: 0.8125rem; color: var(--muted); }
.form input[type="text"], .form input[type="date"], .form input[type="time"], .form input[type="password"], .form select, .form textarea { width: 100%; }
.cols2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 640px) { .cols3 { grid-template-columns: minmax(0, 1fr); } }
.settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.settings label { font-size: 0.8125rem; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.tagline { font-size: 0.75rem; font-weight: 700; color: var(--teal); }
.pip { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--ac1); flex: none; }
.pip.ac2 { background: var(--ac2); } .pip.ac3 { background: var(--ac3); } .pip.ac4 { background: var(--ac4); } .pip.ac5 { background: var(--ac5); }
.pip.ac6 { background: var(--ac6); } .pip.ac7 { background: var(--ac7); } .pip.ac8 { background: var(--ac8); }
.dd, .soon { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--teal); }
.late { color: var(--danger); font-weight: 700; }
.linkbtn { background: none; border: 0; padding: 0; text-align: left; color: var(--ink); cursor: pointer; font-weight: 500; }
.linkbtn:hover { color: var(--teal); text-decoration: underline; }
.mark { background: linear-gradient(transparent 62%, var(--mk-line) 62%); box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.dtext, .dec, .dtext.mark { display: block; background: var(--mk-bg); color: var(--mk-ink); padding: 8px 12px; border-radius: 6px; overflow-wrap: anywhere; white-space: pre-wrap; font-size: 0.9375rem; }
.dec { margin: 0; }
.pw { display: block; font-size: 0.8125rem; color: var(--muted); font-weight: 400; overflow-wrap: anywhere; line-height: 1.5; }
.pw.mark { display: inline; color: var(--ink); }
.colempty { font-size: 0.875rem; color: var(--muted); padding: 8px 2px; }
.klabel { display: inline-flex; align-items: center; gap: 6px; font-size: 0.75rem; font-weight: 700; white-space: nowrap; }
.klabel .kd, .ce .kd { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; display: inline-block; }
.klabel.k-meet { color: var(--km-fg); } .klabel.k-decide { color: var(--kd-fg); } .klabel.k-deadline { color: var(--kl-fg); } .klabel.k-todo { color: var(--kt-fg); } .klabel.k-schedule { color: var(--ks-fg); }
.cst { font-size: 0.75rem; font-weight: 700; border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
.st-draft { background: var(--warn-bg); color: var(--warn-fg); }
.st-wait { background: var(--mk-bg); color: var(--mk-ink); }
.st-ok { background: var(--km-bg); color: var(--km-fg); }
.tstat { font-size: 0.75rem; font-weight: 700; border-radius: 999px; padding: 1px 9px; white-space: nowrap; }
.ts-todo { background: var(--paper-2); color: var(--muted); box-shadow: inset 0 0 0 1px var(--rule-2); }
.ts-doing { background: var(--warn-bg); color: var(--warn-fg); }
.ts-decided { background: var(--mk-bg); color: var(--mk-ink); }
.ts-later { background: var(--ks-bg); color: var(--ks-fg); }
.seal { font-size: 0.6875rem; font-weight: 800; letter-spacing: 0.06em; color: var(--stamp); border: 1.5px solid var(--stamp); border-radius: 4px; padding: 0 5px; line-height: 1.55; transform: rotate(-3deg); flex: none; }

/* sheets and page structure */
.sheet, .panel { background: var(--paper); border: 1px solid var(--rule); border-radius: 12px; padding: 20px 22px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.sheet.narrow { max-width: 860px; }
details.panel > summary, details.group > summary { cursor: pointer; font-weight: 700; }
.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px; }
.head .hint { font-size: 0.8125rem; color: var(--muted); }
.vhead { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.vhead .vt { flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; }
.vhead h2 { font-size: 1.5rem; }
.group { display: flex; flex-direction: column; gap: 10px; padding-top: 18px; border-top: 1px solid var(--rule); }
.group:first-child { padding-top: 0; border-top: 0; }
.group h3 { display: flex; align-items: center; gap: 8px; }
.group h3 small { font-weight: 400; color: var(--muted); }
ol.plain { display: flex; flex-direction: column; gap: 6px; }
ol.plain li { display: flex; gap: 10px; align-items: flex-start; }
ol.plain b { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--sel-bg); color: var(--sel-ink); font-size: 0.75rem; display: inline-flex; align-items: center; justify-content: center; margin-top: 2px; }
.pagehead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.ph-t { display: flex; flex-direction: column; }
.ph-t h2 { font-size: 1.5rem; letter-spacing: -0.02em; }
ol.flow { display: flex; flex-wrap: wrap; gap: 4px 8px; font-size: 0.8125rem; color: var(--muted); }
ol.flow li { display: inline-flex; align-items: center; gap: 8px; }
ol.flow b { color: var(--ink); }
.notice { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; background: var(--mk-bg); color: var(--mk-ink); border-radius: 10px; padding: 10px 14px; font-size: 0.9375rem; }
.notice .btn { background: var(--paper); color: var(--ink); }
.start { background: var(--paper); border: 1px dashed var(--rule-2); border-radius: 12px; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
.start p { max-width: 52ch; }
.sumline { font-size: 0.9375rem; color: var(--muted); }
.sumline b { color: var(--ink); font-variant-numeric: tabular-nums; }
ul.rows li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 10px; align-items: baseline; padding: 10px 0; border-top: 1px solid var(--rule); }
ul.rows li:first-child { border-top: 0; padding-top: 0; }
ul.rows li.two-line { grid-template-columns: minmax(0, 1fr); }
ul.rows li.none { grid-template-columns: 1fr; }
ul.rows .lw { display: flex; flex-direction: column; min-width: 0; }
ul.rows .when { font-size: 0.8125rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.src { font-size: 0.8125rem; color: var(--muted); white-space: nowrap; }
.two { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 800px) { .two { grid-template-columns: minmax(0, 1fr); } }

/* hero */
.avatar { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; border: 3px solid var(--marker); flex: none; }

/* calendar */
.calwrap { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 28px; align-items: start; }
@media (max-width: 980px) { .calwrap { grid-template-columns: minmax(0, 1fr); } }
.calmain { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.calhead { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.mo { font-size: 1.5rem; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.calnav { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.cgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--rule); border-left: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.cw { padding: 6px 8px; font-size: 0.75rem; font-weight: 700; color: var(--muted); background: var(--paper-2); border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); text-align: center; }
.cw.sun { color: var(--danger); }
.cd { min-height: 112px; padding: 4px 6px 6px; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); display: flex; flex-direction: column; gap: 3px; background: var(--paper); cursor: pointer; min-width: 0; }
.cd:hover { background: var(--paper-2); }
.cd.out { background: var(--paper-2); }
.cd.out .num { opacity: 0.45; }
.cd.sel { box-shadow: inset 0 0 0 2px var(--teal); }

  function filt(id) { if (!state.filters[id]) state.filters[id] = { view: "board", areas: false }; return state.filters[id]; }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function pad2(n) { return String(n).padStart(2, "0"); }
  function ymd(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
  function parseYmd(s) { var p = String(s).split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function today() { return ymd(new Date()); }
  function addDays(s, n) { var d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
  function dateLabel(s) { var d = parseYmd(s); return (d.getMonth() + 1) + "월 " + d.getDate() + "일 (" + DOW[d.getDay()] + ")"; }
  function dday(date) {
    var diff = Math.round((parseYmd(date) - parseYmd(today())) / 86400000);
    return diff > 0 ? "D-" + diff : diff === 0 ? "D-day" : "D+" + Math.abs(diff);
  }
  function validYmd(y, mo, da) {
    var d = new Date(y, mo - 1, da); if (d.getFullYear() !== y || d.getMonth() !== mo - 1 || d.getDate() !== da) return ""; return ymd(d);
  }
  /* finds a date written in plain text: 2026.12.31, 2026-12-31, 12월 5일 (the next 12/5 on or after the reference day) */
  function findDate(text, ref) {

      var r = ref || today(), y = parseYmd(r).getFullYear(), c = validYmd(y, +m[1], +m[2]);
      if (c && c < r) c = validYmd(y + 1, +m[1], +m[2]);
      return c;
    }
    return "";
  }
  function lines(s) { return String(s || "").split(/\r?\n/).map(function (x) { return x.trim(); }).filter(Boolean); }
