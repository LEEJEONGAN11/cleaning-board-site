<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><style>body{margin:0}</style></head><body><title>청소 창업 결정 보드</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout concept: shared tabs (home, board, channels) are read-only data; the two personal tabs are private, password-locked workspaces with a timeline and a pinboard of short notes. */
:root {
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --bg: #F6F7FA;
  --surface: #FFFFFF;
  --ink: #101828;
  --muted: #5B6578;
  --line: #E1E5EC;
  --accent: #1445D6;
  --accent-ink: #FFFFFF;
  --accent-tint: #EEF2FF;
  --open-bg: #EDEFF4;
  --open-fg: #3F4A5F;
  --talk-bg: #FFF1CC;
  --talk-fg: #6B4400;
  --decided-bg: #DCF3E5;
  --decided-fg: #0B5A31;
  --done-bg: #E3E8F3;
  --done-fg: #34425F;
  --bar-open: #AEB6C6;
  --bar-talk: #E9A82B;
  --bar-decided: #2E9E62;
  --bar-done: #6C7FA8;
  --danger: #B42318;
  --n-biz: #E3EBFF;
  --n-money: #DDF3E4;
  --n-people: #FBE3EC;
  --n-life: #FFF1CC;
  --n-health: #D8F1EF;
  --n-etc: #ECEEF3;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C111D; --surface: #151B2B; --ink: #F2F4F7; --muted: #A3ADC0; --line: #28324A;
    --accent: #86A2FF; --accent-ink: #0C111D; --accent-tint: #1B2645;
    --open-bg: #212A3D; --open-fg: #C3CAD9;
    --talk-bg: #3A2C0B; --talk-fg: #FFD16B;
    --decided-bg: #0F3321; --decided-fg: #86E3AC;
    --done-bg: #252E45; --done-fg: #B3BFDB;
    --bar-open: #5C667D; --bar-talk: #E9A82B; --bar-decided: #3DB878; --bar-done: #7F92BB;
    --danger: #FF8A80;
    --n-biz: #1F2D5A; --n-money: #17392B; --n-people: #4A2237; --n-life: #3F3210; --n-health: #123B39; --n-etc: #272F45;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C111D; --surface: #151B2B; --ink: #F2F4F7; --muted: #A3ADC0; --line: #28324A;
  --accent: #86A2FF; --accent-ink: #0C111D; --accent-tint: #1B2645;
  --open-bg: #212A3D; --open-fg: #C3CAD9;
  --talk-bg: #3A2C0B; --talk-fg: #FFD16B;
  --decided-bg: #0F3321; --decided-fg: #86E3AC;
  --done-bg: #252E45; --done-fg: #B3BFDB;
  --bar-open: #5C667D; --bar-talk: #E9A82B; --bar-decided: #3DB878; --bar-done: #7F92BB;
  --danger: #FF8A80;
  --n-biz: #1F2D5A; --n-money: #17392B; --n-people: #4A2237; --n-life: #3F3210; --n-health: #123B39; --n-etc: #272F45;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; padding-inline: 16px; padding-block: 24px 64px; }
.wrap { max-width: 980px; margin-inline: auto; display: flex; flex-direction: column; gap: 22px; }
h1, h2, h3, p, ul, ol { margin: 0; }
ul, ol { padding: 0; list-style: none; }
h1 { font-size: 1.7rem; line-height: 1.25; letter-spacing: -0.02em; text-wrap: balance; }
h2 { font-size: 1.1rem; letter-spacing: -0.01em; text-wrap: balance; }
.muted { color: var(--muted); }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.top { display: flex; flex-wrap: wrap; gap: 6px 24px; justify-content: space-between; align-items: end; }
.top .meta { font-size: 0.85rem; color: var(--muted); }
.top .links { font-size: 0.9rem; }

.tabbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--bg); border-bottom: 1px solid var(--line); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: thin; }
.tab { background: none; border: 0; padding: 11px 15px; cursor: pointer; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--accent); }
.tab:hover { color: var(--ink); }
.tab.priv { margin-left: auto; }
.tab.priv ~ .tab.priv { margin-left: 0; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; align-items: baseline; }
.head .hint { font-size: 0.85rem; color: var(--muted); }
.intro { color: var(--muted); max-width: 70ch; }

.bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--open-bg); }
.bar span { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 20px; }
.legend li { display: flex; align-items: center; gap: 7px; font-size: 0.88rem; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.legend b { font-variant-numeric: tabular-nums; }

.two { display: grid; grid-template-columns: 1.15fr 1fr; gap: 16px; align-items: start; }
@media (max-width: 760px) { .two { grid-template-columns: 1fr; } }

.pagerow { display: grid; grid-template-columns: 120px 1fr auto; gap: 8px 16px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 12px 0; cursor: pointer; color: inherit; }
.pagerow:first-of-type { border-top: 0; }
.pagerow .nm { font-weight: 700; }
.pagerow .ct { font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (max-width: 620px) { .pagerow { grid-template-columns: 1fr; } }

ol.week { display: flex; flex-direction: column; }
ol.week li { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line); }
ol.week li:first-child { border-top: 0; padding-top: 0; }
.linkbtn { background: none; border: 0; padding: 0; text-align: left; color: var(--ink); cursor: pointer; font-weight: 500; }
.linkbtn:hover { color: var(--accent); }
.src { font-size: 0.78rem; color: var(--muted); white-space: nowrap; }
.dd { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--accent); }

ul.decided { display: flex; flex-direction: column; gap: 8px; }
ul.decided li { display: grid; grid-template-columns: 8px 1fr; gap: 10px; align-items: baseline; font-size: 0.93rem; }
ul.decided .when { display: block; font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bar-decided); display: inline-block; }

.filters { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row .lbl { font-size: 0.78rem; letter-spacing: 0.06em; color: var(--muted); min-width: 36px; }
.chip { font-size: 0.85rem; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.chip .n { font-variant-numeric: tabular-nums; opacity: 0.75; margin-left: 4px; }
input[type="search"], input[type="text"], input[type="password"], input[type="time"], select, textarea { font-size: 0.9rem; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); min-width: 0; }
input[type="search"] { flex: 1 1 180px; max-width: 300px; }

.group { display: flex; flex-direction: column; gap: 10px; }
.group > h2 { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.group > h2 small { font-size: 0.8rem; font-weight: 400; color: var(--muted); }
details.item { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
details.item[open] { border-color: var(--accent); }
details.item > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 76px 1fr auto; gap: 8px 14px; align-items: center; padding: 12px 16px; }
details.item > summary::-webkit-details-marker { display: none; }
.pill { display: inline-block; text-align: center; font-size: 0.78rem; font-weight: 700; padding: 3px 0; border-radius: 6px; width: 76px; }
.s-open { background: var(--open-bg); color: var(--open-fg); }
.s-talk { background: var(--talk-bg); color: var(--talk-fg); }
.s-decided { background: var(--decided-bg); color: var(--decided-fg); }
.s-done { background: var(--done-bg); color: var(--done-fg); }
.title { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; font-size: 0.78rem; color: var(--muted); }
.tags span { border: 1px solid var(--line); border-radius: 4px; padding: 1px 7px; white-space: nowrap; }
.tags .dd { border-color: var(--accent); }
@media (max-width: 620px) {
  details.item > summary { grid-template-columns: 76px 1fr; }
  .tags { grid-column: 1 / -1; justify-content: flex-start; }
}
.body { padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--line); }
.body h3, .tblhead h3 { font-size: 0.75rem; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin-bottom: 4px; }
.body ul { display: flex; flex-direction: column; gap: 3px; }
.body li { position: relative; padding-left: 14px; }
.body li::before { content: ""; position: absolute; left: 2px; top: 0.7em; width: 5px; height: 5px; border-radius: 50%; background: var(--muted); }
.body .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px 24px; }
.body > div:first-child { padding-top: 12px; }
.body p { overflow-wrap: anywhere; }
.empty { padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; }

.tblwrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.92rem; }
th, td { text-align: left; padding: 9px 12px; border-top: 1px solid var(--line); vertical-align: top; }
th { font-size: 0.78rem; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; border-top: 0; background: var(--accent-tint); }
td:first-child { font-weight: 500; }
.tblhead { display: flex; flex-direction: column; gap: 2px; }

.log { display: flex; flex-direction: column; }
.log li { display: grid; grid-template-columns: 92px 1fr; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 0.93rem; }
.log li:first-child { border-top: 0; }
.log time { color: var(--muted); font-variant-numeric: tabular-nums; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; align-self: flex-start; }
.seg button { background: var(--surface); border: 0; padding: 7px 18px; cursor: pointer; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }

/* personal workspace */
.lock { max-width: 380px; margin: 8vh auto 0; display: flex; flex-direction: column; gap: 12px; }
.lock form { display: flex; flex-direction: column; gap: 10px; }
.lock label { font-size: 0.82rem; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.lock input { padding: 10px 12px; }
.btn { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.danger { border-color: var(--danger); color: var(--danger); }
.btn.small { padding: 4px 10px; font-size: 0.82rem; }
.btn:disabled { opacity: 0.55; cursor: default; }
.msg { min-height: 1.4em; color: var(--muted); font-size: 0.88rem; }
.msg.err { color: var(--danger); }
.who { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
.who .acts { display: flex; gap: 8px; flex-wrap: wrap; }

.timeline { display: flex; flex-direction: column; }
.prow { display: grid; grid-template-columns: 112px 1fr 96px auto; gap: 8px 10px; align-items: center; padding: 8px 0 8px 18px; border-top: 1px solid var(--line); position: relative; }
.prow:first-child { border-top: 0; }
.prow::before { content: ""; position: absolute; left: 3px; top: 50%; width: 8px; height: 8px; margin-top: -4px; border-radius: 50%; background: var(--accent); }
.prow input[type="time"] { font-variant-numeric: tabular-nums; }
.prow input[type="text"] { width: 100%; }
@media (max-width: 620px) { .prow { grid-template-columns: 112px 1fr auto; } .prow select { grid-column: 2; } .prow .btn { grid-row: 1; grid-column: 3; } .prow input[type="text"] { grid-column: 1 / -1; } }

.noteform { display: grid; grid-template-columns: 1fr 120px; gap: 8px; }
.noteform textarea { grid-column: 1 / -1; resize: vertical; min-height: 64px; }
.noteform .btnrow { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.pins { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; padding-top: 6px; }
.pin { position: relative; border-radius: 4px; padding: 18px 14px 12px; display: flex; flex-direction: column; gap: 6px; min-height: 120px; border: 1px solid var(--line); box-shadow: 0 2px 0 var(--line); }
.pin:nth-child(odd) { transform: rotate(-0.6deg); }
.pin:nth-child(even) { transform: rotate(0.6deg); }
.pin::before { content: ""; position: absolute; top: 6px; left: 50%; width: 9px; height: 9px; margin-left: -4px; border-radius: 50%; background: var(--muted); }
.pin[data-cat="사업"] { background: var(--n-biz); }
.pin[data-cat="돈"] { background: var(--n-money); }
.pin[data-cat="사람"] { background: var(--n-people); }
.pin[data-cat="일상"] { background: var(--n-life); }
.pin[data-cat="건강"] { background: var(--n-health); }
.pin[data-cat="기타"] { background: var(--n-etc); }
.pin.resolved { opacity: 0.6; }
.pin.resolved .pt { text-decoration: line-through; }
.pin .cat { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.05em; color: var(--muted); }
.pin .pt { font-weight: 700; overflow-wrap: anywhere; }
.pin .pb { font-size: 0.88rem; overflow-wrap: anywhere; flex: 1; }
.pin .pa { display: flex; gap: 6px; flex-wrap: wrap; }
.pin input, .pin textarea, .pin select { width: 100%; font-size: 0.85rem; }
.backup textarea { width: 100%; min-height: 110px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.8rem; }
footer { font-size: 0.82rem; color: var(--muted); }
.error { padding: 20px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <p class="meta" id="updated">불러오는 중</p>
      <h1>청소 창업 결정 보드</h1>
    </div>
    <p class="links"><a id="pptlink" href="#" target="_blank" rel="noopener" hidden>사업계획 PPT 열기</a></p>
  </header>

  <div class="tabbar">
    <div class="tabs" role="tablist" id="tabs" aria-label="페이지"></div>
  </div>

  <div id="panel" role="tabpanel" class="wrap" style="gap:22px;max-width:none;margin:0"></div>

  <footer>숫자와 금액은 대화에서 조사한 값과 가정입니다. 계약이나 신고 전에 직접 확인한 값으로 바꿉니다. 공용 탭은 대화에서 정해질 때마다 갱신됩니다.</footer>
</div>

<script>
(function () {
  var PAGES = [
    { id: "board", label: "결정 보드", file: "data/board.json" },
    { id: "youtube", label: "유튜브", file: "data/youtube.json" },
    { id: "instagram", label: "인스타그램", file: "data/instagram.json" }
  ];
  var PERSONS = [{ id: "jeongan", name: "이정안" }, { id: "jihun", name: "고지훈" }];
  var TABS = [
    { id: "home", label: "홈" },
    { id: "board", label: "결정 보드" },
    { id: "channels", label: "채널" },
    { id: "jeongan", label: "이정안", priv: true },
    { id: "jihun", label: "고지훈", priv: true }
  ];
  var STATUS = [
    { id: "open", name: "미정", cls: "s-open", bar: "var(--bar-open)" },
    { id: "talk", name: "검토 중", cls: "s-talk", bar: "var(--bar-talk)" },
    { id: "decided", name: "결정", cls: "s-decided", bar: "var(--bar-decided)" },
    { id: "done", name: "완료", cls: "s-done", bar: "var(--bar-done)" }
  ];
  var CATS = ["사업", "돈", "사람", "일상", "건강", "기타"];
  var TAGS = ["일", "운동", "식사", "휴식", "기타"];
  var DATA = {};
  var state = { tab: "home", channel: "youtube", filters: {} };
  try {
    var sv = JSON.parse(localStorage.getItem("board-filters") || "{}");
    Object.keys(sv).forEach(function (k) { state.filters[k] = { area: sv[k].area || "all", status: new Set(sv[k].status || []), q: "" }; });
  } catch (e) {}
  function saveFilters() {
    try {
      var o = {}; Object.keys(state.filters).forEach(function (k) { o[k] = { area: state.filters[k].area, status: Array.from(state.filters[k].status) }; });
      localStorage.setItem("board-filters", JSON.stringify(o));
    } catch (e) {}
  }
  function filt(id) { if (!state.filters[id]) state.filters[id] = { area: "all", status: new Set(), q: "" }; return state.filters[id]; }

  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function statusOf(id) { return STATUS.filter(function (s) { return s.id === id; })[0] || STATUS[0]; }
  function fmt(d) { return String(d).replace(/-/g, "."); }
  function pageLabel(id) { return PAGES.filter(function (p) { return p.id === id; })[0].label; }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function dday(date) {
    var t = new Date(); t.setHours(0, 0, 0, 0);
    var diff = Math.round((new Date(date + "T00:00:00") - t) / 86400000);
    return diff > 0 ? "D-" + diff : diff === 0 ? "D-day" : "D+" + Math.abs(diff);
  }
  function countBy(items) { var c = {}; STATUS.forEach(function (s) { c[s.id] = 0; }); items.forEach(function (i) { c[i.s] = (c[i.s] || 0) + 1; }); return c; }
  function barEl(c, total) {
    var b = el("div", "bar"); b.setAttribute("role", "img");
    b.setAttribute("aria-label", STATUS.map(function (s) { return s.name + " " + c[s.id] + "건"; }).join(", "));
    STATUS.forEach(function (s) { var seg = el("span"); seg.style.width = (total ? c[s.id] / total * 100 : 0) + "%"; seg.style.background = s.bar; b.appendChild(seg); });
    return b;
  }
  function legendEl(c) {
    var u = el("ul", "legend");
    STATUS.forEach(function (s) {
      var li = el("li"); var sw = el("i"); sw.style.background = s.bar; li.appendChild(sw);
      li.appendChild(el("span", null, s.name)); li.appendChild(el("b", null, c[s.id] + "건")); u.appendChild(li);
    });
    return u;
  }
  function go(id) {
    state.tab = id;
    try { if (location.hash !== "#" + id) location.hash = id; } catch (e) {}
    render(); window.scrollTo(0, 0);
  }
  function goPage(pid) {
    if (pid === "youtube" || pid === "instagram") { state.channel = pid; go("channels"); } else go(pid);
  }
  function routeOf(h) {
    if (h === "youtube" || h === "instagram") { state.channel = h; return "channels"; }
    if (h === "decided") return "board";
    if (h === "daily") return "home";
    return TABS.some(function (t) { return t.id === h; }) ? h : null;
  }

  function renderTabs() {
    var t = document.getElementById("tabs"); t.textContent = "";
    TABS.forEach(function (x) {
      var b = el("button", "tab" + (x.priv ? " priv" : ""), x.label); b.type = "button"; b.setAttribute("role", "tab"); b.setAttribute("aria-selected", String(state.tab === x.id));
      b.addEventListener("click", function () { go(x.id); }); t.appendChild(b);
    });
  }

  /* ---------- shared: home ---------- */
  function renderHome(root) {
    var s1 = el("section", "panel"); var h = el("div", "head"); h.appendChild(el("h2", null, "페이지별 현황")); h.appendChild(el("p", "hint", "누르면 해당 페이지로 이동"));
    s1.appendChild(h);
    PAGES.forEach(function (p) {
      var d = DATA[p.id]; if (!d) return;
      var c = countBy(d.items);
      var b = el("button", "pagerow"); b.type = "button";
      b.appendChild(el("span", "nm", p.label)); b.appendChild(barEl(c, d.items.length));
      b.appendChild(el("span", "ct", "결정·완료 " + (c.decided + c.done) + " · 검토 중 " + c.talk + " · 미정 " + c.open));
      b.addEventListener("click", function () { goPage(p.id); }); s1.appendChild(b);
    });
    root.appendChild(s1);

    var two = el("div", "two");
    var wk = el("section", "panel"); var wh = el("div", "head"); wh.appendChild(el("h2", null, "이번 주에 먼저")); wh.appendChild(el("p", "hint", "시기가 이번 주인 항목")); wk.appendChild(wh);
    var ol = el("ol", "week"); var n = 0;
    PAGES.forEach(function (p) {
      var d = DATA[p.id]; if (!d) return;
      d.items.filter(function (i) { return i.when === "이번 주" && i.s !== "done"; }).forEach(function (i) {
        n++; var li = el("li"); var b = el("button", "linkbtn", i.title); b.type = "button"; b.addEventListener("click", function () { goPage(p.id); });
        li.appendChild(b); li.appendChild(el("span", "src", p.label + " · " + i.who)); ol.appendChild(li);
      });
    });
    if (!n) ol.appendChild(el("li", "muted", "이번 주 항목이 없습니다."));
    wk.appendChild(ol); two.appendChild(wk);

    var right = el("div"); right.style.cssText = "display:flex;flex-direction:column;gap:16px;min-width:0";
    var dl = el("section", "panel"); var dh = el("div", "head"); dh.appendChild(el("h2", null, "다가오는 날짜")); dl.appendChild(dh);
    var du = el("ol", "week"); var dn = 0; var dated = [];
    PAGES.forEach(function (p) { var d = DATA[p.id]; if (d) d.items.forEach(function (i) { if (i.date && i.s !== "done") dated.push({ i: i, p: p }); }); });
    dated.sort(function (a, b) { return a.i.date < b.i.date ? -1 : 1; });
    dated.forEach(function (x) {
      dn++; var li = el("li"); var b = el("button", "linkbtn", x.i.title); b.type = "button"; b.addEventListener("click", function () { goPage(x.p.id); });
      li.appendChild(b); var r = el("span", "src"); r.appendChild(document.createTextNode(fmt(x.i.date) + " "));
      r.appendChild(el("span", "dd", dday(x.i.date))); li.appendChild(r); du.appendChild(li);
    });
    if (!dn) du.appendChild(el("li", "muted", "정해진 날짜가 없습니다."));
    dl.appendChild(du); right.appendChild(dl);

    var rc = el("section", "panel"); var rh = el("div", "head"); rh.appendChild(el("h2", null, "최근 정한 것")); rc.appendChild(rh);
    var all = [];
    PAGES.forEach(function (p) { var d = DATA[p.id]; if (d && d.decided) d.decided.forEach(function (x) { all.push({ d: x.d, t: x.t, p: p.label }); }); });
    all.sort(function (a, b) { return a.d < b.d ? 1 : a.d > b.d ? -1 : 0; });
    var ul = el("ul", "decided");
    all.slice(0, 5).forEach(function (x) { var li = el("li"); li.appendChild(el("span", "dot")); var w = el("span"); w.appendChild(document.createTextNode(x.t)); w.appendChild(el("span", "when", fmt(x.d) + " · " + x.p)); li.appendChild(w); ul.appendChild(li); });
    if (!all.length) ul.appendChild(el("li", "muted", "아직 정한 것이 없습니다."));
    rc.appendChild(ul); right.appendChild(rc);
    two.appendChild(right); root.appendChild(two);
  }

  /* ---------- shared: plan pages (board, channels) ---------- */
  function sectionList(title, list) {
    if (!list || !list.length) return null;
    var d = el("div"); d.appendChild(el("h3", null, title)); var u = el("ul");
    list.forEach(function (t) { u.appendChild(el("li", null, t)); }); d.appendChild(u); return d;
  }

        var p = el("div", "pin" + (n.done ? " resolved" : "")); p.setAttribute("data-cat", n.cat);
        if (s.editing === n.id) {
          var et = el("input"); et.type = "text"; et.value = n.title; et.maxLength = 24; et.setAttribute("aria-label", "제목");
          var ec = el("select"); ec.setAttribute("aria-label", "분류"); CATS.forEach(function (c) { var o = el("option", null, c); o.value = c; if (c === n.cat) o.selected = true; ec.appendChild(o); });
          var eb = el("textarea"); eb.value = n.body; eb.maxLength = 90; eb.setAttribute("aria-label", "내용");
          var ac = el("div", "pa");
          var sv2 = el("button", "btn small primary", "저장"); sv2.type = "button";
          sv2.addEventListener("click", function () { n.title = et.value.trim() || n.title; n.body = eb.value.trim(); n.cat = ec.value; s.editing = null; persist(id); drawBoard(); });
          var cc = el("button", "btn small", "취소"); cc.type = "button"; cc.addEventListener("click", function () { s.editing = null; drawBoard(); });
          ac.appendChild(sv2); ac.appendChild(cc);
          p.appendChild(et); p.appendChild(ec); p.appendChild(eb); p.appendChild(ac);
        } else {
          p.appendChild(el("span", "cat", n.cat)); p.appendChild(el("p", "pt", n.title)); p.appendChild(el("p", "pb", n.body));
          var pa = el("div", "pa");
          var dn = el("button", "btn small", n.done ? "다시 열기" : "정리됨"); dn.type = "button"; dn.addEventListener("click", function () { n.done = !n.done; persist(id); drawBoard(); });
          var ed = el("button", "btn small", "수정"); ed.type = "button"; ed.addEventListener("click", function () { s.editing = n.id; drawBoard(); });
          var rm = el("button", "btn small", "삭제"); rm.type = "button"; rm.addEventListener("click", function () { data.notes = data.notes.filter(function (x) { return x.id !== n.id; }); persist(id); drawBoard(); });
          pa.appendChild(dn); pa.appendChild(ed); pa.appendChild(rm); p.appendChild(pa);
        }
        pins.appendChild(p);
      });
    }
    drawBoard(); root.appendChild(pb);

    /* backup */
    var bk = el("details", "panel backup"); bk.appendChild(el("summary", null, "백업, 다른 기기로 옮기기, Claude에게 정리 맡기기"));
    var bt = el("textarea"); bt.id = "bk-" + id; bt.setAttribute("aria-label", "백업 내용"); bt.placeholder = "내보내기를 누르면 여기에 내용이 나옵니다. 가져오려면 여기에 붙여 넣고 가져오기를 누르세요.";
    var bm = el("p", "msg"); bm.setAttribute("role", "status");
    var br2 = el("div", "acts"); br2.style.cssText = "display:flex;gap:8px;flex-wrap:wrap";
    var ex2 = el("button", "btn small", "내보내기(복사)"); ex2.type = "button";
    ex2.addEventListener("click", function () {
      bt.value = JSON.stringify({ v: 1, owner: person.name, plan: data.plan, notes: data.notes }, null, 1); bt.select();
      var ok = function () { bm.className = "msg"; bm.textContent = "복사했습니다. 다른 기기나 메모장에 붙여 넣어 보관하세요."; };
      var fail = function () { bm.className = "msg"; bm.textContent = "자동 복사가 안 되어 선택해 두었습니다. 직접 복사하세요."; };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(bt.value).then(ok, fail); else fail();
    });
    var im = el("button", "btn small", "가져오기(덮어쓰기)"); im.type = "button"; var armed2 = false;
    im.addEventListener("click", function () {
      var obj; try { obj = JSON.parse(bt.value); } catch (e) { bm.className = "msg err"; bm.textContent = "내용을 읽을 수 없습니다. 내보내기로 받은 글을 그대로 붙여 넣으세요."; return; }
      if (!obj || !Array.isArray(obj.plan) || !Array.isArray(obj.notes)) { bm.className = "msg err"; bm.textContent = "계획표와 핀이 들어 있는 내용이 아닙니다."; return; }
      if (!armed2) { armed2 = true; im.textContent = "한 번 더 누르면 현재 내용이 바뀝니다"; return; }
      data.plan = obj.plan.map(function (r) { return { id: r.id || uid(), time: r.time || "", text: String(r.text || "").slice(0, 40), tag: TAGS.indexOf(r.tag) >= 0 ? r.tag : "기타" }; });
      data.notes = obj.notes.map(function (n) { return { id: n.id || uid(), title: String(n.title || "").slice(0, 24), body: String(n.body || "").slice(0, 90), cat: CATS.indexOf(n.cat) >= 0 ? n.cat : "기타", done: !!n.done, ts: n.ts || Date.now() }; });
      armed2 = false; im.textContent = "가져오기(덮어쓰기)"; persist(id); drawPlan(); drawBoard(); bm.className = "msg"; bm.textContent = "가져왔습니다.";
    });
    br2.appendChild(ex2); br2.appendChild(im);
    var tip = el("p", "muted", "Claude에게 정리를 맡기려면 내보내기로 복사한 글을 대화에 붙여 넣으세요. 이 공간의 내용은 Claude가 직접 읽을 수 없습니다.");
    bk.appendChild(bt); bk.appendChild(br2); bk.appendChild(bm); bk.appendChild(tip);
    bk.style.gap = "10px"; root.appendChild(bk);
  }

  function render() {
    renderTabs();
    var root = document.getElementById("panel"); root.textContent = "";
    if (state.tab === "home") renderHome(root);
    else if (state.tab === "board") renderPlan("board", root);
    else if (state.tab === "channels") renderChannels(root);
    else if (state.tab === "jeongan" || state.tab === "jihun") renderPerson(state.tab, root);
  }

  /* ---------- site gate (public copy) and loading ---------- */
  function b64(s) { var bin = atob(s), a = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }
  function decryptWith(pin, enc) {
    var s = crypto.subtle;
    return s.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveBits"]).then(function (base) {
      return s.deriveBits({ name: "PBKDF2", salt: b64(enc.salt), iterations: enc.iter, hash: "SHA-256" }, base, 512);
    }).then(function (bits) {
      var k = new Uint8Array(bits);
      return Promise.all([
        s.importKey("raw", k.slice(0, 32), "AES-CBC", false, ["decrypt"]),
        s.importKey("raw", k.slice(32), { name: "HMAC", hash: "SHA-256" }, false, ["verify"])
      ]);
    }).then(function (keys) {
      var iv = b64(enc.iv), ct = b64(enc.ct), data = new Uint8Array(iv.length + ct.length);
      data.set(iv, 0); data.set(ct, iv.length);
      return s.verify("HMAC", keys[1], b64(enc.mac), data).then(function (ok) {
        if (!ok) throw new Error("bad code");
        return s.decrypt({ name: "AES-CBC", iv: iv }, keys[0], ct);
      });
    }).then(function (pt) { return JSON.parse(new TextDecoder().decode(pt)); });
  }
  function showLock(enc) {
    var tb = document.querySelector(".tabbar"), lk = document.querySelector(".links"); tb.hidden = true; lk.hidden = true;
    document.getElementById("updated").textContent = "잠겨 있음";
    var root = document.getElementById("panel"); root.textContent = "";
    var box = el("div", "lock"); box.appendChild(el("h2", null, "입장 코드를 입력하세요"));
    box.appendChild(el("p", "muted", "허락받은 사람만 볼 수 있는 페이지입니다."));
    var f = el("form"); f.style.cssText = "display:flex;flex-direction:row;gap:8px";
    var inp = el("input"); inp.type = "password"; inp.id = "pin"; inp.setAttribute("inputmode", "numeric"); inp.autocomplete = "off"; inp.setAttribute("aria-label", "입장 코드"); inp.style.cssText = "flex:1;letter-spacing:0.3em";
    var btn = el("button", "btn primary", "열기"); btn.type = "submit"; f.appendChild(inp); f.appendChild(btn); box.appendChild(f);
    var msg = el("p", "msg"); msg.setAttribute("role", "status"); box.appendChild(msg); root.appendChild(box);
    f.addEventListener("submit", function (e) {
      e.preventDefault(); msg.className = "msg"; msg.textContent = "확인 중"; btn.disabled = true;
      decryptWith(inp.value, enc).then(function (all) {
        PAGES.forEach(function (p) { DATA[p.id] = all[p.id]; });
        tb.hidden = false; lk.hidden = false; ready();
      }).catch(function () { msg.className = "msg err"; msg.textContent = "코드가 맞지 않습니다."; btn.disabled = false; inp.select(); });
    });
    inp.focus();
  }
  function ready() {
    var latest = ""; PAGES.forEach(function (p) { if (DATA[p.id].updated > latest) latest = DATA[p.id].updated; });
    document.getElementById("updated").textContent = "마지막 갱신 " + fmt(latest);
    var pl = document.getElementById("pptlink");
    if (DATA.board && DATA.board.pptUrl) { pl.href = DATA.board.pptUrl; pl.hidden = false; }
    render();
  }
  function load() {
    var root = document.getElementById("panel"); root.textContent = "";
    if (window.__BOARD_ENC__ && !window.__BOARD_DATA__) { showLock(window.__BOARD_ENC__); return Promise.resolve(); }
    /* The published page carries its data inline (build.ps1 fills __BOARD_DATA__); fetching the JSON files is only the fallback for local preview. */
    var inline = window.__BOARD_DATA__;
    if (inline && PAGES.every(function (p) { return inline[p.id]; })) {
      PAGES.forEach(function (p) { DATA[p.id] = inline[p.id]; });
      ready(); return Promise.resolve();
    }
    root.appendChild(el("p", "muted", "불러오는 중"));
    return Promise.all(PAGES.map(function (p) {
      return fetch(p.file, { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error(p.file); return r.json(); }).then(function (j) { DATA[p.id] = j; });
    })).then(ready).catch(function () {
      root.textContent = ""; var e = el("div", "error"); e.appendChild(el("p", null, "데이터를 불러오지 못했습니다. 잠시 뒤 다시 시도해 주세요."));
      var b = el("button", "btn primary", "다시 불러오기"); b.type = "button"; b.addEventListener("click", load); e.appendChild(b); root.appendChild(e);
      document.getElementById("updated").textContent = "불러오지 못함";
    });
  }

  var h0 = ""; try { h0 = location.hash.slice(1); } catch (e) {}
  var r0 = routeOf(h0); if (r0) state.tab = r0;
  window.addEventListener("hashchange", function () {
    var h = ""; try { h = location.hash.slice(1); } catch (e) {}
    var r = routeOf(h); if (r && r !== state.tab) { state.tab = r; if (DATA.board) render(); }
  });
  renderTabs();
  load();
})();
</script>
</body></html>
